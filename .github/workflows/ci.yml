name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Protocol checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            qt6-base-dev

      - name: Configure checks only
        run: cmake -S . -B build -DBUILD_APP=OFF -DBUILD_CHECKS=ON

      - name: Build and run checks
        run: |
          cmake --build build -j"$(nproc)"
          ./build/wfdvideomode-check
          ./build/wfdaudiomode-check
          ./build/displaysource-check
          ./build/dlna-check
          ./build/dbus-check

  debian-source:
    name: Debian source sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check packaging files
        run: |
          test -x debian/rules
          grep -q 'debhelper-compat (= 13)' debian/control
          grep -q 'libdtk6widget-dev' debian/control
          grep -q 'Architecture: any' debian/control
          grep -q 'com.01tool.cast.desktop' CMakeLists.txt
          test -f data/com.01tool.cast.desktop
          test -f data/com.ot01tool.Cast.conf
          grep -q 'own="com.ot01tool.Cast"' data/com.ot01tool.Cast.conf
          desktop-file-validate data/com.01tool.cast.desktop || true
          test -f LICENSE
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE
          grep -q 'Source: https://github.com/01Tool/Cast' debian/copyright
          grep -q 'GPL-3.0-or-later' debian/copyright
          CMAKE_VERSION="$(sed -n 's/^project(ot-cast VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          CHANGELOG_VERSION="$(sed -n 's/^ot-cast (\([^)]*\)).*/\1/p' debian/changelog | head -1)"
          APP_VERSION="$(sed -n 's/.*setApplicationVersion(QStringLiteral("\([0-9.]*\)").*/\1/p' src/main.cpp)"
          test -n "${CMAKE_VERSION}"
          test "${CMAKE_VERSION}" = "${CHANGELOG_VERSION}"
          test "${CMAKE_VERSION}" = "${APP_VERSION}"
