name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    name: Protocol checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config qt6-base-dev
      - name: Build and run checks
        run: |
          cmake -S . -B build -DBUILD_APP=OFF -DBUILD_CHECKS=ON
          cmake --build build -j"$(nproc)"
          ./build/wfdvideomode-check
          ./build/wfdaudiomode-check
          ./build/displaysource-check
          ./build/dlna-check
          ./build/dbus-check

  source-release:
    name: GitHub source release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source archive
        id: archive
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CMAKE_VERSION="$(sed -n 's/^project(ot-cast VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          CHANGELOG_VERSION="$(sed -n 's/^ot-cast (\([^)]*\)).*/\1/p' debian/changelog | head -1)"
          if [ "${VERSION}" != "${CMAKE_VERSION}" ]; then
            echo "Tag ${TAG} does not match CMake version ${CMAKE_VERSION}" >&2
            exit 1
          fi
          if [ "${VERSION}" != "${CHANGELOG_VERSION}" ]; then
            echo "Tag ${TAG} does not match debian/changelog ${CHANGELOG_VERSION}" >&2
            exit 1
          fi
          PREFIX="ot-cast-${VERSION}"
          TARBALL="${PREFIX}.tar.gz"
          git archive --format=tar.gz --prefix="${PREFIX}/" -o "${TARBALL}" HEAD
          sha256sum -- "${TARBALL}" > SHA256SUMS
          test -s SHA256SUMS
          grep -F "${TARBALL}" SHA256SUMS
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cast ${{ steps.archive.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.archive.outputs.tarball }}
            SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            Source release of Cast (ot-cast) ${{ steps.archive.outputs.version }} from https://github.com/01Tool/Cast.

            This GitHub Release attaches the **source tarball** (`ot-cast-${{ steps.archive.outputs.version }}.tar.gz`) and **SHA256SUMS**. Ubuntu Actions cannot build DTK6, so there is **no** `.deb` or AppImage here and **no** amd64 / arm64 / loong64 binary in this upload.

            Verify:

            ```
            sha256sum -c SHA256SUMS
            ```

            License: GPL-3.0-or-later (`LICENSE`).

            **In this cut (X11, version ${{ steps.archive.outputs.version }}):**
            - Send this screen, or a local video / photo / audio file
            - Miracast: NetworkManager P2P, MS-MICE (Windows Connect), WPS PIN/PBC, WFD/RTSP, H.264 MPEG-TS/RTP
            - WFD audio: AAC-LC when the sink lists it, otherwise LPCM (48 kHz)
            - DLNA: SSDP MediaRenderer, live HTTP MPEG-TS up to 1080p30 or file HTTP with Range, AVTransport Play
            - Each device row is labeled **Miracast** or **DLNA**
            - DDE quick panel talks to `ot-cast` over D-Bus (no protocol stack in the plugin)
            - zh_CN / zh_TW

            Wayland / Treeland capture is stubbed. Not an official Deepin component. Not every TV; not “low latency.”

            Native `.deb` (`debian/control` `Architecture: any`) on Deepin / a DTK6 system, for **that host’s** arch:

            ```
            sudo apt build-dep .
            dpkg-buildpackage -us -uc -b
            ```

            Or `./scripts/package.sh` for `.deb` and AppImage on the machine you run it on.
