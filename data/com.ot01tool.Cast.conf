<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Session bus is already per-user; XML cannot match a caller executable.
       ot-cast still checks /proc/<pid>/exe for Cast1 methods. -->
  <policy context="default">
    <allow own="com.ot01tool.Cast"/>
    <allow send_destination="com.ot01tool.Cast"/>
    <allow receive_sender="com.ot01tool.Cast"/>
  </policy>
</busconfig>
